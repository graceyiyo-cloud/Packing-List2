<body>
    <div id="root"></div>

    <script type="text/babel">
        // Lucide outline icons.
        const svg = (paths, { size = 20, className = "", stroke = 2 } = {}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{paths}</svg>

        const Icons = {
            Trash: (p) => svg(<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>, p),

            Pencil: (p) => svg(<><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></>, p),
            Share: (p) => svg(<><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></>, p),
            ChevronDown: (p) => svg(<path d="m6 9 6 6 6-6"/>, p),
            ChevronRight: (p) => svg(<path d="m9 18 6-6-6-6"/>, p),
            FolderInput: (p) => svg(<><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2"/><path d="m8 16 3-3-3-3"/><path d="M2 13h9"/></>, p),
            RotateCcw: (p) => svg(<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>, p),
            Eye: (p) => svg(<><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></>, p),
            EyeOff: (p) => svg(<><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></>, p),
            ListOrdered: (p) => svg(<><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></>, p),
            Bag: (p) => svg(<><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"/><path d="M9 10h6"/></>, { stroke: 1.5, ...p }),
            Copy: (p) => svg(<><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>, p),
            Sparkles: (p) => svg(<><path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.13a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.13 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0Z"/></>, p),
        };

        const firebaseConfig = {
          apiKey: "AIzaSyB34DnVg26SFsKh3yj3r01YKCflCKiOvjo",
          authDomain: "packing-list-app-3730f.firebaseapp.com",
          projectId: "packing-list-app-3730f",
          storageBucket: "packing-list-app-3730f.firebasestorage.app",
          messagingSenderId: "29252379952",
          appId: "1:29252379952:web:0f482df90af76c227ed4f5",
          measurementId: "G-44WGM8ZX4P"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'my-packing-list-v1';
        // Same Firestore location as before, so every existing list keeps working.
        const listRef = (id) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(id).doc('main');
        const keyOf = (cat, item) => `${cat}-${item}`;

        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const initialKidsData = {
          "醫藥與防護": ["備用藥品(擦的、退燒、咳嗽藥水)", "耳溫槍", "電蚊香", "兒童防曬乳", "長棉花棒", "衛生棉，棉條", "濕紙巾", "保潔墊"],
          "電子產品": ["小孩手機", "行動電源", "插頭+充電線", "小電風扇", "吹風機", "自拍腳架"],
          "小孩衣物用品": ["替換褲", "被子、枕頭", "外套", "襪子", "拖鞋", "水壺", "保久乳", "食物剪刀", "孩子們零食", "玩沙組", "浴巾"],
          "大人個人用品": ["大人換洗衣物", "化妝品、保養品", "洗髮精、沐浴乳", "鏡子"],
          "備註": []
        };
        const DEFAULT_CATEGORY_ORDER = ["醫藥與防護", "電子產品", "小孩衣物用品", "大人個人用品", "備註"];
        const cleanId = (s) => s.trim().replace(/[^a-zA-Z0-9一-龥-_]/g, '');
        const fullOrder = (data, order) => {
            const keys = Object.keys(data || {});
            const result = (order && order.length ? order : DEFAULT_CATEGORY_ORDER).filter(k => keys.includes(k));
            keys.forEach(k => { if (!result.includes(k)) result.push(k); });
            return result;
        };
        const countOf = (data, checked) => {
            let total = 0, done = 0;
            Object.keys(data || {}).forEach(cat => (data[cat] || []).forEach(item => { total++; if (checked.includes(keyOf(cat, item))) done++; }));
            return { total, done };
        };

        // Trip history now remembers up to 30 lists with the last visit and progress.
        // The old key (names only, last 5) is migrated once and left untouched.
        const HISTORY_KEY = 'packing_history_v2';
        const loadHistory = () => {
            try {
                const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
                if (Array.isArray(saved)) return saved.filter(x => x && x.id);
                const old = JSON.parse(localStorage.getItem('kids_packing_history') || '[]');
                return old.filter(x => typeof x === 'string' && x).map(id => ({ id }));
            } catch { return []; }
        };
        const saveHistory = (list) => { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30))); } catch {} };
        const shortDate = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };

        // Browser history keeps back navigation layered: sheet → organize mode → list → home.
        const navState = () => (history.state && history.state.pl) ? history.state : null;
        const urlFor = (id) => id ? `${location.pathname}?list=${encodeURIComponent(id)}` : location.pathname;

        /** Reorders rows by dragging a handle; works with touch, mouse and pen. */
        function Sortable({ items, getKey, onMove, renderItem, className = "" }) {
            const box = useRef(null);
            const state = useRef(null);
            const [drag, setDrag] = useState(null);
            const begin = (e, index) => {
                if (e.button !== undefined && e.button !== 0) return;
                const rows = [...box.current.children];
                const rects = rows.map(r => r.getBoundingClientRect());
                const gap = rects.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 0;
                const s = { from: index, to: index, dy: 0, startY: e.clientY, startScroll: window.scrollY, rects, size: rects[index].height + gap };
                state.current = s;
                e.currentTarget.setPointerCapture(e.pointerId);
                setDrag({ ...s });
            };
            const move = (e) => {
                const s = state.current; if (!s) return;
                if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 12);
                s.dy = e.clientY + window.scrollY - s.startY - s.startScroll;
                const r = s.rects[s.from], center = r.top + r.height / 2 + s.dy;
                let to = s.from;
                s.rects.forEach((q, i) => { const mid = q.top + q.height / 2; if (i < s.from && center < mid) to = Math.min(to, i); if (i > s.from && center > mid) to = Math.max(to, i); });
                s.to = to; setDrag({ ...s });
            };
            const end = () => { const s = state.current; state.current = null; setDrag(null); if (s && s.to !== s.from) onMove(s.from, s.to); };
            const shift = (i) => {
                if (!drag) return 0;
                if (i === drag.from) return drag.dy;
                if (drag.from < drag.to && i > drag.from && i <= drag.to) return -drag.size;
                if (drag.to < drag.from && i >= drag.to && i < drag.from) return drag.size;
                return 0;
            };
            return (
                <div ref={box} className={className}>
                    {items.map((item, i) => (
                        <div key={getKey(item, i)} className={`sortable-row ${drag && drag.from === i ? 'is-dragging' : ''}`} style={{ transform: `translateY(${shift(i)}px)` }}>
                            {renderItem(item, i, { onPointerDown: (e) => begin(e, i), onPointerMove: move, onPointerUp: end, onPointerCancel: end, className: 'drag-handle' })}
                        </div>
                    ))}
                </div>
            );
        }

        function Sheet({ title, onClose, children }) {
            return (
                <div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-ink/20 backdrop-blur-sm" onClick={onClose}>
                    <div role="dialog" aria-modal="true" aria-label={title} className="sheet-enter bg-paper w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] border border-stone shadow-float max-h-[85vh] overflow-y-auto safe-bottom" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-6 pt-5 pb-3">
                            <h3 className="text-lg font-bold text-ink">{title}</h3>
                            <button onClick={onClose} aria-label="關閉" className="p-2 -mr-2 rounded-full text-grass hover:bg-stone"><Icons.X /></button>
                        </div>
                        <div className="px-4 pb-2">{children}</div>
                    </div>
                </div>
            );
        }

        function ChoiceRow({ icon, title, note, onClick, disabled }) {
            return (
                <button onClick={onClick} disabled={disabled} className="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-left hover:bg-stone/60 disabled:opacity-40 disabled:hover:bg-transparent transition-colors min-h-[56px]">
                    <span className="w-10 h-10 rounded-xl bg-moss/10 text-moss flex items-center justify-center flex-shrink-0">{icon}</span>
                    <span className="flex-1 min-w-0"><span className="block font-bold text-ink truncate">{title}</span>{note && <span className="block text-xs text-grass mt-0.5 truncate">{note}</span>}</span>
                    <Icons.ChevronRight size={18} className="text-stone flex-shrink-0" />
                </button>
            );
        }

        function App() {
          const [user, setUser] = useState(null);
          const [listId, setListId] = useState('');
          const [enteredId, setEnteredId] = useState('');
          const [data, setData] = useState({});
          const [checkedItems, setCheckedItems] = useState([]);
          const [categoryOrder, setCategoryOrder] = useState([]);
          const [loading, setLoading] = useState(false);
          const [missing, setMissing] = useState(false);
          const [historyList, setHistoryList] = useState(loadHistory);
          const [organize, setOrganize] = useState(false);
          const [sheet, setSheet] = useState(null);          // 'move:cat:idx' | 'order' | 'share' | 'confirm' | 'menu'
          const [confirm, setConfirm] = useState(null);
          const [hideDone, setHideDone] = useState(() => { try { return localStorage.getItem('packing_hide_done') === '1'; } catch { return false; } });
          const [collapsed, setCollapsed] = useState({});
          const [newItemText, setNewItemText] = useState({});
          const [newCategoryName, setNewCategoryName] = useState('');
          const [editing, setEditing] = useState(null);        // { type: 'cat'|'item', cat, idx, value }
          const [toast, setToast] = useState(null);
          const toastTimer = useRef(null);

          const showToast = (message, undo) => {
              clearTimeout(toastTimer.current);
              setToast({ message, undo });
              toastTimer.current = setTimeout(() => setToast(null), undo ? 5000 : 2200);
          };

          // Navigation ---------------------------------------------------------
          const applyNav = (s) => {
              const id = s && s.view === 'list' ? s.id : '';
              setListId(id);
              setOrganize(Boolean(s && s.organize));
              setSheet(s && s.sheet ? s.sheet : null);
              if (!(s && s.sheet)) { setConfirm(null); }
              setEditing(null);
          };
          const push = (s, url) => { history.pushState({ pl: true, ...s }, '', url); applyNav({ ...s }); };
          const openList = (raw) => {
              const id = cleanId(raw || '');
              if (!id) return;
              setEnteredId('');
              push({ view: 'list', id, fromHome: true }, urlFor(id));
          };
          const goHome = () => { const s = navState(); if (s && s.view === 'list' && s.fromHome) history.back(); else { history.replaceState({ pl: true, view: 'home' }, '', urlFor('')); applyNav(null); } };
          const openSheet = (name) => { const s = navState() || {}; push({ ...s, view: 'list', id: listId, sheet: name }, location.href); };
          const closeSheet = () => { const s = navState(); if (s && s.sheet) history.back(); else { setSheet(null); setConfirm(null); } };
          const setOrganizeMode = (on) => {
              if (on) { push({ ...(navState() || {}), view: 'list', id: listId, organize: true, sheet: null }, location.href); }
              else { const s = navState(); if (s && s.organize && !s.sheet) history.back(); else setOrganize(false); }
          };

          useEffect(() => {
            auth.signInAnonymously().catch((err) => console.error("登入失敗:", err));
            const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
            const fromUrl = new URLSearchParams(location.search).get('list');
            const current = navState();
            if (current) applyNav(current);
            else if (fromUrl && cleanId(fromUrl)) { history.replaceState({ pl: true, view: 'list', id: cleanId(fromUrl) }, '', urlFor(cleanId(fromUrl))); applyNav({ view: 'list', id: cleanId(fromUrl) }); }
            else history.replaceState({ pl: true, view: 'home' }, '', urlFor(''));
            const onPop = (e) => applyNav(e.state && e.state.pl ? e.state : null);
            window.addEventListener('popstate', onPop);
            return () => { unsubscribe(); window.removeEventListener('popstate', onPop); };
          }, []);

          // Remember each opened list with its date and progress.
          const remember = useCallback((id, extra) => {
              setHistoryList(prev => {
                  const old = prev.find(h => h.id === id) || { id };
                  const next = [{ ...old, ...extra, id }, ...prev.filter(h => h.id !== id)];
                  saveHistory(next);
                  return next;
              });
          }, []);

          useEffect(() => {
            if (!user || !listId) return;
            setLoading(true); setMissing(false); setData({}); setCheckedItems([]); setCategoryOrder([]);
            remember(listId, { openedAt: new Date().toISOString() });
            const unsubscribe = listRef(listId).onSnapshot({ includeMetadataChanges: true }, (docSnap) => {
              if (docSnap.exists) {
                const remote = docSnap.data();
                const nextData = remote.listData || {};
                const checked = remote.checkedItems || [];
                setData(nextData); setCheckedItems(checked); setCategoryOrder(fullOrder(nextData, remote.categoryOrder));
                setMissing(false); setLoading(false);
                remember(listId, countOf(nextData, checked));
              } else if (!docSnap.metadata.fromCache) {
                // A new name: let the user choose what to start from instead of always using the default list.
                setMissing(true); setLoading(false);
              }
            }, (error) => { console.error("同步錯誤:", error); setLoading(false); showToast('同步失敗，請檢查網路'); });
            return () => unsubscribe();
          }, [user, listId]);

          // Writes --------------------------------------------------------------
          const write = (payload) => listRef(listId).update(payload).catch(err => { console.error(err); showToast('儲存失敗，請重試'); });

          const createList = async (source) => {
              let listData = initialKidsData, order = DEFAULT_CATEGORY_ORDER;
              if (source === 'blank') { listData = { "未分類": [] }; order = ["未分類"]; }
              else if (source && source !== 'default') {
                  const snap = await listRef(source).get();
                  if (snap.exists) { const d = snap.data(); listData = d.listData || {}; order = fullOrder(listData, d.categoryOrder); }
              }
              await listRef(listId).set({ listData, checkedItems: [], categoryOrder: order, createdAt: new Date().toISOString(), ...(source && source !== 'default' && source !== 'blank' ? { copiedFrom: source } : {}) });
          };

          const toggleCheck = (cat, item) => {
            const key = keyOf(cat, item);
            write({ checkedItems: checkedItems.includes(key) ? firebase.firestore.FieldValue.arrayRemove(key) : firebase.firestore.FieldValue.arrayUnion(key) });
          };

          const addItem = (cat) => {
            const text = (newItemText[cat] || '').trim();
            if (!text) return;
            write({ listData: { ...data, [cat]: [...(data[cat] || []), text] } });
            setNewItemText(prev => ({ ...prev, [cat]: '' }));
          };

          const deleteItem = (cat, idx) => {
              const item = data[cat][idx], key = keyOf(cat, item), wasChecked = checkedItems.includes(key);
              const list = data[cat].filter((_, i) => i !== idx);
              write({ listData: { ...data, [cat]: list }, checkedItems: firebase.firestore.FieldValue.arrayRemove(key) });
              showToast(`已刪除「${item}」`, () => {
                  listRef(listId).get().then(snap => {
                      const d = (snap.data() || {}).listData || {};
                      const restored = [...(d[cat] || [])]; restored.splice(Math.min(idx, restored.length), 0, item);
                      const payload = { listData: { ...d, [cat]: restored } };
                      if (wasChecked) payload.checkedItems = firebase.firestore.FieldValue.arrayUnion(key);
                      listRef(listId).update(payload);
                  });
              });
          };

          const reorderItem = (cat, from, to) => {
              const list = [...data[cat]]; const [moved] = list.splice(from, 1); list.splice(to, 0, moved);
              setData(d => ({ ...d, [cat]: list }));
              write({ listData: { ...data, [cat]: list } });
          };

          const moveItem = (cat, idx, toCat) => {
              const item = data[cat][idx];
              const oldKey = keyOf(cat, item), newKey = keyOf(toCat, item);
              const nextData = { ...data, [cat]: data[cat].filter((_, i) => i !== idx), [toCat]: [...(data[toCat] || []), item] };
              const payload = { listData: nextData };
              if (checkedItems.includes(oldKey)) payload.checkedItems = [...checkedItems.filter(k => k !== oldKey), newKey];
              write(payload);
              closeSheet();
              showToast(`已移到「${toCat}」`);
          };

          const renameItem = (cat, idx, value) => {
              const name = value.trim(), old = data[cat][idx];
              setEditing(null);
              if (!name || name === old) return;
              const list = [...data[cat]]; list[idx] = name;
              const payload = { listData: { ...data, [cat]: list } };
              const oldKey = keyOf(cat, old);
              if (checkedItems.includes(oldKey)) payload.checkedItems = checkedItems.map(k => k === oldKey ? keyOf(cat, name) : k);
              write(payload);
          };

          const renameCategory = (oldName, value) => {
              const name = value.trim();
              setEditing(null);
              if (!name || name === oldName) return;
              if (data[name]) { showToast('已經有同名分類'); return; }
              const nextData = {};
              Object.keys(data).forEach(k => { nextData[k === oldName ? name : k] = data[k]; });
              const prefix = `${oldName}-`;
              write({
                  listData: nextData,
                  categoryOrder: categoryOrder.map(n => n === oldName ? name : n),
                  checkedItems: checkedItems.map(k => k.startsWith(prefix) ? `${name}-${k.substring(prefix.length)}` : k),
              });
          };

          const addCategory = () => {
             const name = newCategoryName.trim();
             if (!name) return;
             if (data[name]) { showToast('已經有同名分類'); return; }
             write({ listData: { ...data, [name]: [] }, categoryOrder: [...categoryOrder, name] });
             setNewCategoryName('');
          };

          const deleteCategory = (cat) => {
              setConfirm({
                  title: `刪除「${cat}」？`,
                  message: data[cat].length ? `裡面的 ${data[cat].length} 個項目也會一起刪除。` : '這個分類是空的。',
                  action: '刪除分類',
                  run: () => {
                      const nextData = { ...data }; delete nextData[cat];
                      const prefix = `${cat}-`;
                      write({ listData: nextData, categoryOrder: categoryOrder.filter(c => c !== cat), checkedItems: checkedItems.filter(k => !k.startsWith(prefix)) });
                  },
              });
              openSheet('confirm');
          };

          const reorderCategories = (from, to) => {
              const order = [...categoryOrder]; const [moved] = order.splice(from, 1); order.splice(to, 0, moved);
              setCategoryOrder(order);
              write({ categoryOrder: order });
          };

          const resetChecks = () => {
              setConfirm({ title: '清除所有勾選？', message: '項目會保留，只把打包狀態清空，適合下一趟旅行再用。', action: '清除勾選', run: () => write({ checkedItems: [] }) });
              openSheet('confirm');
          };

          const share = async () => {
              const url = `${location.origin}${urlFor(listId)}`;
              try {
                  if (navigator.share) { await navigator.share({ title: `行李清單：${listId}`, text: `一起整理「${listId}」的行李`, url }); return; }
                  await navigator.clipboard.writeText(url); showToast('已複製連結，傳給家人就能一起編輯');
              } catch (e) { if (e && e.name !== 'AbortError') showToast(`清單名稱：${listId}`); }
          };

          const removeFromHistory = (id) => {
              const before = historyList;
              const next = historyList.filter(h => h.id !== id);
              setHistoryList(next); saveHistory(next);
              showToast(`已從紀錄移除「${id}」`, () => { setHistoryList(before); saveHistory(before); });
          };

          const { total, done } = useMemo(() => countOf(data, checkedItems), [data, checkedItems]);
          const percent = total ? Math.round(done / total * 100) : 0;

          const toastView = toast && (
              <div role="status" className="toast-enter fixed left-1/2 bottom-6 z-[120] bg-ink text-paper rounded-full pl-5 pr-2 py-2 flex items-center gap-3 shadow-float max-w-[92vw]" style={{ transform: 'translateX(-50%)' }}>
                  <span className="text-sm truncate">{toast.message}</span>
                  {toast.undo ? <button onClick={() => { toast.undo(); setToast(null); }} className="text-sand font-bold text-sm px-3 py-1.5 rounded-full hover:bg-white/10">復原</button> : <span className="w-2" />}
              </div>
          );

          // Home ----------------------------------------------------------------
          if (!listId) {
            const typed = cleanId(enteredId);
            const exists = historyList.some(h => h.id === typed);
            return (
              <div className="min-h-screen px-4 pt-10 pb-16 relative overflow-hidden">
                <div className="blob-bg w-96 h-96 bg-moss -top-20 -left-20"></div>
                <div className="blob-bg w-80 h-80 bg-clay top-40 -right-20"></div>
                <div className="max-w-md mx-auto">
                  <div className="flex items-center gap-3 mb-8 px-1">
                    <span className="p-3 rounded-2xl bg-moss/10 text-moss"><Icons.Bag size={30} /></span>
                    <h1 className="text-3xl font-bold text-ink tracking-tight">行李清單</h1>
                  </div>
                  <form onSubmit={(e) => { e.preventDefault(); openList(enteredId); }} className="bg-white/80 backdrop-blur-md border border-white/60 rounded-[2rem] p-4 shadow-float">
                    <label htmlFor="list-name" className="block text-sm font-bold text-moss mb-2 ml-2">清單名稱</label>
                    <div className="flex gap-2">
                      <input id="list-name" type="text" value={enteredId} onChange={(e) => setEnteredId(e.target.value)} placeholder="例如：2026沖繩" autoComplete="off" className="flex-1 min-w-0 px-5 py-3 rounded-full border border-stone bg-white focus:outline-none focus:ring-2 focus:ring-moss/20 focus:border-moss/50 text-ink font-medium" />
                      <button type="submit" disabled={!typed} className="bg-moss text-white font-bold px-5 rounded-full disabled:opacity-40 active:scale-95 transition-transform">{exists ? '開啟' : '開始'}</button>
                    </div>
                    <p className="text-xs text-grass mt-3 ml-2">家人輸入同一個名稱，就能一起勾選。</p>
                  </form>

                  <h2 className="text-sm font-bold text-clay mt-10 mb-3 ml-2">我的清單</h2>
                  {historyList.length ? (
                    <div className="space-y-2">
                      {historyList.map(h => {
                          const p = h.total ? Math.round((h.done || 0) / h.total * 100) : 0;
                          return (
                            <div key={h.id} className="flex items-center bg-white/70 border border-stone/70 rounded-2xl hover:border-moss/30 hover:bg-white transition-colors">
                              <button onClick={() => openList(h.id)} className="flex-1 min-w-0 text-left px-4 py-3">
                                <span className="block font-bold text-ink truncate">{h.id}</span>
                                <span className="flex items-center gap-2 mt-1.5 text-xs text-grass">
                                  {h.total !== undefined ? <>
                                    <span className="h-1.5 w-16 bg-stone rounded-full overflow-hidden"><span className="block h-full bg-moss rounded-full" style={{ width: `${p}%` }} /></span>
                                    <span>{h.done || 0}/{h.total}</span>
                                  </> : <span>尚未同步進度</span>}
                                  {h.openedAt && <span>· {shortDate(h.openedAt)}</span>}
                                </span>
                              </button>
                              <button onClick={() => removeFromHistory(h.id)} aria-label={`從紀錄移除 ${h.id}`} title="從紀錄移除（不會刪除清單）" className="p-3 mr-1 rounded-full text-grass/60 hover:text-destructive hover:bg-stone/60"><Icons.X size={18} /></button>
                            </div>
                          );
                      })}
                    </div>
                  ) : <p className="text-sm text-grass ml-2">開過的清單會留在這裡。</p>}
                </div>
                {toastView}
              </div>
            );
          }

          // List ------------------------------------------------------------------
          const moveTarget = sheet && sheet.startsWith('move:') ? (() => { const [, cat, idx] = sheet.split(':'); return data[cat] && data[cat][Number(idx)] !== undefined ? { cat, idx: Number(idx), item: data[cat][Number(idx)] } : null; })() : null;
          const templates = historyList.filter(h => h.id !== listId);

          const itemRow = (cat, item, idx, handle) => {
              const isChecked = checkedItems.includes(keyOf(cat, item));
              if (organize) {
                  const isEditing = editing && editing.type === 'item' && editing.cat === cat && editing.idx === idx;
                  return (
                      <div className="flex items-center gap-1 pl-2 pr-2 py-1.5 min-h-[48px]">
                          <span {...handle} aria-label={`拖曳排序 ${item}`} className="drag-handle p-2 text-clay/60"><Icons.Grip size={18} /></span>
                          {isEditing ? (
                              <input autoFocus value={editing.value} onChange={e => setEditing({ ...editing, value: e.target.value })} onBlur={() => renameItem(cat, idx, editing.value)} onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') setEditing(null); }} className="flex-1 min-w-0 px-3 py-1.5 rounded-xl border border-clay/30 bg-white focus:outline-none text-base" />
                          ) : (
                              <button onClick={() => setEditing({ type: 'item', cat, idx, value: item })} className="flex-1 min-w-0 text-left px-1 py-1.5 text-base text-ink truncate" aria-label={`改名 ${item}`}>{item}</button>
                          )}
                          <button onClick={() => openSheet(`move:${cat}:${idx}`)} aria-label={`移動 ${item} 到其他分類`} title="移到其他分類" className="p-2 rounded-full text-grass hover:text-moss hover:bg-moss/10"><Icons.FolderInput size={18} /></button>
                          <button onClick={() => deleteItem(cat, idx)} aria-label={`刪除 ${item}`} title="刪除" className="p-2 rounded-full text-grass hover:text-destructive hover:bg-stone/60"><Icons.Trash size={18} /></button>
                      </div>
                  );
              }
              return (
                  <button onClick={() => toggleCheck(cat, item)} role="checkbox" aria-checked={isChecked} className={`w-full flex items-center gap-3 px-5 py-3 text-left min-h-[48px] active:bg-sand/20 transition-colors ${isChecked ? 'opacity-60' : ''}`}>
                      <span className={`w-5 h-5 organic-checkbox border-2 flex items-center justify-center flex-shrink-0 transition-all ${isChecked ? 'bg-moss border-moss' : 'bg-white border-sand'}`}>{isChecked && <Icons.Check size={12} className="text-white" />}</span>
                      <span className={`text-base font-medium ${isChecked ? 'text-grass line-through decoration-stone' : 'text-ink'}`}>{item}</span>
                  </button>
              );
          };

          const visibleCategories = categoryOrder.filter(cat => data[cat]);

          return (
            <div className="min-h-screen pb-28 relative">
              <div className="blob-bg w-[500px] h-[500px] bg-sand -top-40 -right-40 opacity-40"></div>
              <div className="blob-bg w-[400px] h-[400px] bg-moss/20 top-80 -left-20"></div>

              <header className="sticky top-0 z-30 px-3 pt-3 pb-2 bg-paper/85 backdrop-blur-md">
                  <div className="max-w-3xl mx-auto flex items-center gap-2">
                      <button onClick={organize ? () => setOrganizeMode(false) : goHome} aria-label={organize ? '完成整理' : '回到我的清單'} className="p-2.5 rounded-full bg-stone/60 hover:bg-stone text-ink flex-shrink-0"><Icons.ArrowLeft size={18} /></button>
                      <div className="flex-1 min-w-0">
                          <h1 className="text-base font-bold text-ink truncate">{listId}</h1>
                          {!loading && !missing && <div className="flex items-center gap-2 mt-1"><span className="h-1.5 flex-1 max-w-[140px] bg-stone rounded-full overflow-hidden"><span className="block h-full bg-moss rounded-full transition-all duration-500" style={{ width: `${percent}%` }} /></span><span className="text-xs font-bold text-moss">{done}/{total}</span></div>}
                      </div>
                      {!organize && !missing && <button onClick={share} aria-label="分享清單" title="分享清單" className="p-2.5 rounded-full text-grass hover:text-moss hover:bg-moss/10"><Icons.Share size={19} /></button>}
                      {!missing && <button onClick={() => setOrganizeMode(!organize)} className={`px-4 py-2 rounded-full font-bold text-sm flex-shrink-0 transition-colors ${organize ? 'bg-moss text-white' : 'bg-white border border-stone text-ink hover:border-moss/40'}`}>{organize ? '完成' : '整理'}</button>}
                  </div>
                  {!organize && !loading && !missing && (
                      <div className="max-w-3xl mx-auto flex items-center gap-2 mt-2 overflow-x-auto">
                          <button onClick={() => { const v = !hideDone; setHideDone(v); try { localStorage.setItem('packing_hide_done', v ? '1' : '0'); } catch {} }} aria-pressed={hideDone} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border whitespace-nowrap ${hideDone ? 'bg-moss/10 border-moss/30 text-moss' : 'bg-white/70 border-stone text-grass'}`}>{hideDone ? <Icons.EyeOff size={14} /> : <Icons.Eye size={14} />}只看未打包</button>
                          <button onClick={resetChecks} disabled={!done} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border bg-white/70 border-stone text-grass whitespace-nowrap disabled:opacity-40"><Icons.RotateCcw size={14} />清除勾選</button>
                      </div>
                  )}
                  {organize && <p className="max-w-3xl mx-auto text-xs text-grass mt-2 px-1">拖曳 <Icons.Grip size={12} className="inline align-[-2px]" /> 排序，點名稱改名</p>}
              </header>

              <main className="max-w-3xl mx-auto px-3 pt-2 space-y-4">
                {loading ? (
                    <div className="flex flex-col justify-center items-center h-40 gap-4"><div className="w-10 h-10 rounded-full border-4 border-stone border-t-moss animate-spin"></div><p className="text-moss text-sm">正在打開清單…</p></div>
                ) : missing ? (
                    <div className="bg-white/80 border border-stone rounded-[2rem] p-3 shadow-soft">
                        <h2 className="text-lg font-bold text-ink px-3 pt-3">建立「{listId}」</h2>
                        <p className="text-sm text-grass px-3 mt-1 mb-3">要從哪裡開始？</p>
                        {templates.length > 0 && <p className="text-xs font-bold text-clay px-3 mt-2 mb-1">沿用之前的清單（不含勾選）</p>}
                        {templates.slice(0, 8).map(h => <ChoiceRow key={h.id} icon={<Icons.Copy size={18} />} title={h.id} note={h.total !== undefined ? `${h.total} 項` : ''} onClick={() => createList(h.id)} />)}
                        <p className="text-xs font-bold text-clay px-3 mt-3 mb-1">全新清單</p>
                        <ChoiceRow icon={<Icons.Sparkles size={18} />} title="預設清單" note="親子出遊常用的 5 個分類" onClick={() => createList('default')} />
                        <ChoiceRow icon={<Icons.Plus size={18} />} title="空白清單" note="自己新增分類與項目" onClick={() => createList('blank')} />
                    </div>
                ) : (
                  <>
                    {total > 0 && done === total && !organize && <div className="text-center text-moss font-bold py-2">全部打包完成，出發吧！</div>}
                    {organize && visibleCategories.length > 1 && (
                        <button onClick={() => openSheet('order')} className="w-full flex items-center justify-center gap-2 py-3 rounded-2xl border border-dashed border-clay/50 text-clay font-bold bg-white/50"><Icons.ListOrdered size={18} />調整分類順序</button>
                    )}
                    {visibleCategories.map((cat) => {
                      const items = data[cat];
                      const catDone = items.filter(it => checkedItems.includes(keyOf(cat, it))).length;
                      const isCollapsed = !organize && collapsed[cat];
                      const shown = !organize && hideDone ? items.map((it, i) => [it, i]).filter(([it]) => !checkedItems.includes(keyOf(cat, it))) : items.map((it, i) => [it, i]);
                      if (!organize && hideDone && shown.length === 0 && items.length > 0) return null;
                      const editingCat = editing && editing.type === 'cat' && editing.cat === cat;
                      return (
                        <section key={cat} className="bg-[#FEFEFA] rounded-[1.75rem] border border-stone/70 shadow-soft">
                          <div className="bg-sand/30 rounded-t-[1.75rem] px-3 py-2 flex items-center gap-1 min-h-[56px]">
                            {organize ? (
                                editingCat ? (
                                    <input autoFocus value={editing.value} onChange={e => setEditing({ ...editing, value: e.target.value })} onBlur={() => renameCategory(cat, editing.value)} onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') setEditing(null); }} className="flex-1 min-w-0 mx-1 px-3 py-1.5 rounded-xl border border-clay/30 bg-white focus:outline-none font-bold text-lg" />
                                ) : (
                                    <button onClick={() => setEditing({ type: 'cat', cat, value: cat })} className="flex-1 min-w-0 flex items-center gap-2 text-left px-2 py-1.5" aria-label={`改名分類 ${cat}`}><h2 className="font-bold text-ink text-lg truncate">{cat}</h2><Icons.Pencil size={14} className="text-clay/70 flex-shrink-0" /></button>
                                )
                            ) : (
                                <button onClick={() => setCollapsed(c => ({ ...c, [cat]: !c[cat] }))} aria-expanded={!isCollapsed} className="flex-1 min-w-0 flex items-center gap-2 text-left px-2 py-1.5">
                                    <Icons.ChevronDown size={18} className={`text-clay flex-shrink-0 transition-transform ${isCollapsed ? '-rotate-90' : ''}`} />
                                    <h2 className="font-bold text-ink text-lg truncate">{cat}</h2>
                                    <span className={`ml-auto text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${items.length && catDone === items.length ? 'bg-moss text-white' : 'text-grass'}`}>{catDone}/{items.length}</span>
                                </button>
                            )}
                            {organize && <button onClick={() => deleteCategory(cat)} aria-label={`刪除分類 ${cat}`} title="刪除分類" className="p-2 rounded-full text-grass hover:text-destructive hover:bg-white/70 flex-shrink-0"><Icons.Trash size={18} /></button>}
                          </div>
                          {!isCollapsed && (
                            <>
                              {organize ? (
                                  <Sortable items={items} getKey={(it, i) => `${cat}-${i}-${it}`} onMove={(from, to) => reorderItem(cat, from, to)} className="divide-y divide-stone/50" renderItem={(it, i, handle) => itemRow(cat, it, i, handle)} />
                              ) : (
                                  <div className="divide-y divide-stone/50">{shown.map(([it, i]) => <div key={`${cat}-${i}`}>{itemRow(cat, it, i)}</div>)}</div>
                              )}
                              <form onSubmit={e => { e.preventDefault(); addItem(cat); }} className="px-3 py-2.5 flex gap-2 border-t border-stone/40">
                                <input type="text" value={newItemText[cat] || ''} onChange={(e) => setNewItemText({ ...newItemText, [cat]: e.target.value })} placeholder="新增項目" aria-label={`新增項目到 ${cat}`} className="flex-1 min-w-0 px-4 py-2 rounded-full border border-stone bg-white/80 focus:outline-none focus:ring-2 focus:ring-moss/20 text-ink text-base" />
                                <button type="submit" disabled={!(newItemText[cat] || '').trim()} aria-label={`加入 ${cat}`} className="bg-moss text-white p-2.5 rounded-full disabled:opacity-30 active:scale-95 transition-transform"><Icons.Plus size={16} /></button>
                              </form>
                            </>
                          )}
                        </section>
                      );
                    })}
                    {organize && (
                        <form onSubmit={e => { e.preventDefault(); addCategory(); }} className="bg-white/70 p-1.5 rounded-full border border-stone flex items-center gap-2">
                            <input type="text" value={newCategoryName} onChange={(e) => setNewCategoryName(e.target.value)} placeholder="新增分類" aria-label="新增分類名稱" className="flex-1 min-w-0 px-4 py-2 bg-transparent focus:outline-none text-ink font-medium" />
                            <button type="submit" disabled={!newCategoryName.trim()} className="bg-clay text-white px-4 py-2.5 rounded-full font-bold disabled:opacity-40 flex items-center gap-1"><Icons.Plus size={16} />分類</button>
                        </form>
                    )}
                  </>
                )}
              </main>

              {sheet === 'order' && (
                  <Sheet title="分類順序" onClose={closeSheet}>
                      <p className="text-xs text-grass px-3 mb-2">按住右邊把手上下拖曳</p>
                      <Sortable items={categoryOrder.filter(c => data[c])} getKey={(c) => c} onMove={reorderCategories} className="space-y-2 pb-2" renderItem={(c, i, handle) => (
                          <div className="flex items-center gap-3 bg-white border border-stone rounded-2xl pl-4 pr-1 min-h-[52px]">
                              <span className="flex-1 font-bold text-ink truncate">{c}</span>
                              <span className="text-xs text-grass">{data[c].length} 項</span>
                              <span {...handle} aria-label={`拖曳排序 ${c}`} className="drag-handle p-3 text-clay/70"><Icons.Grip size={20} /></span>
                          </div>
                      )} />
                  </Sheet>
              )}
              {moveTarget && (
                  <Sheet title={`把「${moveTarget.item}」移到`} onClose={closeSheet}>
                      {visibleCategories.map(c => (
                          <ChoiceRow key={c} icon={<Icons.FolderInput size={18} />} title={c} note={c === moveTarget.cat ? '目前分類' : `${data[c].length} 項`} disabled={c === moveTarget.cat} onClick={() => moveItem(moveTarget.cat, moveTarget.idx, c)} />
                      ))}
                  </Sheet>
              )}
              {sheet === 'confirm' && confirm && (
                  <Sheet title={confirm.title} onClose={closeSheet}>
                      <p className="text-sm text-grass px-3 mb-5">{confirm.message}</p>
                      <div className="flex gap-3 px-2 pb-2">
                          <button onClick={closeSheet} className="flex-1 py-3 rounded-full border border-stone text-ink font-bold">取消</button>
                          <button onClick={() => { const run = confirm.run; closeSheet(); run(); }} className="flex-1 py-3 rounded-full bg-destructive text-white font-bold">{confirm.action}</button>
                      </div>
                  </Sheet>
              )}
              {toastView}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
